{% extends "base.html" %}

{% block title %}{{ object.name }} | CampusBites{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start gap-3">
            <div>
                <p class="text-muted mb-1">{{ object.category.name }}</p>
                <h1>{{ object.name }}</h1>
            </div>
            {% if object.is_available %}
            <span class="badge text-bg-success">Available</span>
            {% else %}
            <span class="badge text-bg-secondary">Sold out</span>
            {% endif %}
        </div>
        <p class="fs-4 fw-semibold">PKR {{ object.price }}</p>
        <a class="btn btn-outline-primary" href="{% url 'home' %}">Back to menu</a>
    </div>
</div>
{% endblock %}
